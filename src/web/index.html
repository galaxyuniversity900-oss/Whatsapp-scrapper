<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WA Workspace</title><style>body{font:16px system-ui;margin:0;background:#101316;color:#eee}main{max-width:1000px;margin:auto;padding:20px}.card{background:#191e23;padding:16px;margin:12px 0;border:1px solid #30363d}input,button,textarea{padding:10px;margin:4px;background:#0d1117;color:#eee;border:1px solid #444}button{cursor:pointer}pre{white-space:pre-wrap}.ok{color:#7ee787}img{max-width:280px}</style></head><body><main><h1>WA Workspace</h1><div class="card"><b>Multi-Platform Web Mode</b><p id="health">Connecting…</p></div><div class="card"><h2>Connect account</h2><input id="id" placeholder="sales-01"><input id="bin" placeholder="Chromium/Chrome path (optional)"><button onclick="connect()">Connect</button><div id="qr"></div></div><div class="card"><h2>Sessions</h2><pre id="sessions"></pre></div><div class="card"><h2>Consent-based campaign</h2><input id="account" placeholder="Account ID"><textarea id="msg" placeholder="Message"></textarea><input id="limit" type="number" value="100"><button onclick="campaign()">Start</button><pre id="result"></pre></div></main><script>
async function api(p,o){const r=await fetch(p,o);return r.json()} async function refresh(){document.querySelector('#health').textContent=JSON.stringify(await api('/api/health'));document.querySelector('#sessions').textContent=JSON.stringify(await api('/api/sessions'),null,2)} async function connect(){const id=document.querySelector('#id').value;const bin=document.querySelector('#bin').value;document.querySelector('#qr').textContent='Waiting for QR…';await api('/api/session/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,executablePath:bin||undefined,headless:true})});} async function campaign(){const r=await api('/api/campaign/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accountId:document.querySelector('#account').value,template:document.querySelector('#msg').value,limit:Number(document.querySelector('#limit').value)})});document.querySelector('#result').textContent=JSON.stringify(r,null,2)} const es=new EventSource('/events');es.addEventListener('qr',e=>{const x=JSON.parse(e.data);document.querySelector('#qr').innerHTML='<p>Scan QR:</p><img src="'+x.qr+'">'});es.addEventListener('session:status',e=>{console.log(e.data);refresh()});es.addEventListener('campaign:done',e=>document.querySelector('#result').textContent=e.data);refresh();setInterval(refresh,5000);
</script></body></html>
