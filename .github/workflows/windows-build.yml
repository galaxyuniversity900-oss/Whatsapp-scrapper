name: CI and Windows Build
on:
  push:
    branches: [main, production-hardening-2026-09-18, professional-production-2026-09-18]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:all
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-scrapper-windows
          path: dist/*
          if-no-files-found: error
