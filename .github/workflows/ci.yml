name: Platform 5.3 Verification
on:
  push:
    branches: ["main", "feature/**", "completion-gate-**"]
  pull_request:
    branches: ["main", "feature/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run lint
      - run: npm run test:all
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:completion
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-scrapper-windows-build
          path: dist/*
