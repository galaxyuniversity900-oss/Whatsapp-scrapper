name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-client
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android source
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/galaxyuniversity/whatsappscrapper/MainActivity.java
          grep -q "applicationId 'com.galaxyuniversity.whatsappscrapper'" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK artifact
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-scrapper-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
