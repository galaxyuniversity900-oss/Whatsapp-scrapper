name: Android APK v1.2.5 — full verification

on:
  push:
    branches: [main, master, android-v1-2-5-full-verification-2026-10-29]
    paths:
      - "android/**"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full application regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run all regression tests
        run: npm run test:all
      - name: Validate Termux shell scripts
        run: bash -n scripts/termux-service.sh scripts/termux-setup.sh
      - name: Run Termux service smoke test
        run: npm run termux:test
      - name: Verify Android runtime-routing regression test
        run: node test/31-android-event-stream-tests.js
      - name: Verify Android app version and permissions
        run: |
          grep -q 'versionCode = 8' android/app/build.gradle.kts
          grep -q 'versionName = "1.2.5"' android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          test -s src/web/index.html
          test -s src/server.js

  build-debug-apk:
    name: Build Android APK
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate server and shell syntax
        run: |
          node --check src/server.js
          bash -n scripts/termux-service.sh scripts/termux-setup.sh
      - name: Bundle latest web UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -R src/web/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          node -e "const fs=require('fs'); const p='src/web/index.html'; const a='android/app/src/main/assets/index.html'; if(fs.readFileSync(p,'utf8')!==fs.readFileSync(a,'utf8')) process.exit(1)"
          echo "Bundled $(find android/app/src/main/assets -type f | wc -l) web asset files"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package and version metadata
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Whatsapp-Scrapper-v1.2.5.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatsapp-Scrapper-v1.2.5
          path: Whatsapp-Scrapper-v1.2.5.apk
          if-no-files-found: error
          retention-days: 30
