name: Android APK v1.2.3

on:
  push:
    branches: [main, master, android-apk-version-1-2-0, android-runtime-repair-2026-10-29]
    paths:
      - "android/**"
      - "src/web/**"
      - "src/server.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/web/**"
      - "src/server.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Node server syntax
        run: node --check src/server.js
      - name: Validate Termux shell scripts
        run: bash -n scripts/termux-service.sh scripts/termux-setup.sh
      - name: Test Android bundled event stream routing
        run: node test/31-android-event-stream-tests.js
      - name: Verify web entry point
        run: test -s src/web/index.html
      - name: Bundle web UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -R src/web/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          echo "Bundled $(find android/app/src/main/assets -type f | wc -l) web asset files"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK to Whatsapp-Scrapper-v1.2.3.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Whatsapp-Scrapper-v1.2.3.apk
      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatsapp-Scrapper-v1.2.3
          path: Whatsapp-Scrapper-v1.2.3.apk
          if-no-files-found: error
          retention-days: 14
